name: Release macOS

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate version and release protections
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -B -m unittest discover -s scripts/tests -p 'test_release.py' -v
          python3 scripts/release.py metadata "$RELEASE_TAG"

  build:
    name: Build DMG (${{ matrix.arch }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      LANG: en_US.UTF-8
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      CHAT_BRIDGE_SIGNING_IDENTITY: '-'
      CHAT_BRIDGE_RELEASE_TAG: ${{ github.ref_name }}
      CHAT_BRIDGE_BUILD_NUMBER: ${{ github.run_number }}
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify native runner and toolchain
        run: |
          test "$(uname -m)" = "$TARGET_ARCH"
          xcodebuild -version
          swift --version
      - name: Test and build the app with its bundled runtime
        run: bash scripts/build-app.sh
      - name: Package and verify the disk image
        run: bash scripts/package-dmg.sh 'dist/Chat Bridge.app' "$CHAT_BRIDGE_RELEASE_TAG" "$TARGET_ARCH" dist/release
      - name: Upload verified DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dmg-${{ matrix.arch }}
          path: dist/release/*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  publish:
    name: Publish both architectures
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dmg-*
          path: dist/release
          merge-multiple: true
          digest-mismatch: error
      - name: Verify uploads and publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: python3 scripts/release.py publish dist/release "$RELEASE_TAG" "$RELEASE_REPOSITORY" "$RELEASE_COMMIT"
